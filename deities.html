<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>神明谱系 · 硇洲岛田野图集</title>
  <link rel="stylesheet" href="/map.css"><link rel="stylesheet" href="/deity-atlas.css"><link rel="stylesheet" href="/deity-villages.css"><link rel="stylesheet" href="/cloud-access.css"><link rel="stylesheet" href="/archive-management.css">
</head>
<body class="deity-page">
  <header class="atlas-header">
    <div class="atlas-brand"><a href="/">硇洲岛田野图集</a><span>/</span><h1>神明谱系</h1><small>DEITY ATLAS</small></div>
    <div class="atlas-header-actions"><a class="atlas-map-link" href="/">返回地图</a><button id="deity-new" class="primary" type="button" disabled>新增神明</button></div>
  </header>
  <main class="deity-layout">
    <nav class="deity-navigation" aria-label="神函分类">
      <div class="atlas-eyebrow">神函索引</div><div id="deity-categories"></div>
      <button id="deity-titles-edit" class="linkbutton" type="button" disabled>维护神函</button>
      <div id="cloud-access" class="cloud-access" hidden><span id="cloud-access-status"></span><button id="cloud-access-button" type="button">登录编辑</button></div>
      <details class="atlas-backup"><summary>资料备份</summary><div class="button-row"><button id="deity-export" type="button" disabled>导出</button><button id="deity-import" type="button" disabled>导入</button></div><input id="deity-import-file" type="file" accept=".json,application/json" hidden></details>
    </nav>
    <section class="deity-browser" aria-label="神明列表">
      <label class="atlas-search" for="deity-search"><span class="atlas-eyebrow">检索神明</span><input id="deity-search" type="search" placeholder="名称或别名" autocomplete="off" maxlength="100"></label>
      <div class="atlas-list-caption"><span id="deity-filter-name">全部神明</span><span id="deity-list-count"></span></div>
      <p id="deity-status" class="status" role="status" aria-live="polite">正在读取…</p><div id="deity-list"></div>
    </section>
    <section id="deity-detail" class="deity-detail" aria-label="神明档案">
      <div id="deity-placeholder" class="atlas-placeholder"><span class="atlas-eyebrow">DEITY RECORD</span><h2>选择一份神明档案</h2><p>以神明为线索，连接村庄与地方信仰。</p></div>
      <article id="deity-record" hidden></article>
      <form id="deity-form" hidden>
        <span class="atlas-eyebrow">DEITY RECORD</span><h2 id="deity-form-heading">新增神明</h2><p class="note">同名神明可分别建档；身份以档案 ID 区分。</p>
        <div id="deity-fields"></div><div class="button-row form-actions"><button type="submit" class="primary">保存档案</button><button id="deity-cancel" type="button">取消</button></div><p id="deity-form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <dialog id="deity-titles-dialog" class="atlas-dialog"><form id="deity-titles-form"><h2>神函索引</h2><div id="deity-title-fields"></div><label for="deity-title-new">新增神函</label><input id="deity-title-new" maxlength="80"><div class="button-row form-actions"><button type="submit" class="primary">保存索引</button><button id="deity-titles-cancel" type="button">取消</button></div><p id="deity-titles-status" class="status" role="status" aria-live="polite"></p></form></dialog>
  <dialog id="cloud-login" class="cloud-login" aria-labelledby="cloud-login-title"><form id="cloud-login-form"><h2 id="cloud-login-title">登录编辑</h2><label for="cloud-password">编辑口令</label><input id="cloud-password" type="password" autocomplete="current-password" required><p id="cloud-login-status" class="status" role="status"></p><div class="button-row form-actions"><button type="submit" class="primary">登录</button><button id="cloud-login-cancel" type="button">取消</button></div></form></dialog>
  <script src="/place-names.js"></script><script src="/cloud-access.js"></script><script src="/archive-management.js"></script><script src="/deity-catalog.js"></script><script src="/deity-villages.js"></script><script src="/deity-atlas.js"></script>
</body>
</html>
