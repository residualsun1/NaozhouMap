[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/deities"
  to = "/deities.html"
  status = 200

[[redirects]]
  from = "/deities/"
  to = "/deities.html"
  status = 200

[[headers]]
  for = "/people"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/people"
  to = "/people.html"
  status = 200

[[redirects]]
  from = "/people/"
  to = "/people.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
